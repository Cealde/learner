<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <!-- Shadow -->
  <rect x="18" y="24" width="74" height="54" rx="4" fill="#111111" />
  <rect x="98" y="32" width="22" height="66" rx="4" fill="#111111" />
  <rect x="34" y="92" width="42" height="8" rx="3" fill="#111111" />

  <!-- Monitor Stand -->
  <rect x="46" y="72" width="12" height="18" fill="#111111" />
  <rect x="30" y="88" width="44" height="9" rx="3" fill="#FFD43B" stroke="#111111" stroke-width="3" stroke-linejoin="round" />

  <!-- Monitor Case -->
  <rect x="14" y="20" width="74" height="54" rx="4" fill="#2563EB" stroke="#111111" stroke-width="3.5" stroke-linejoin="round" />
  
  <!-- Monitor Screen -->
  <rect x="20" y="26" width="62" height="42" rx="2" fill="#F5F1E8" stroke="#111111" stroke-width="2.5" />
  
  <!-- Screen Elements (Code Terminal) -->
  <circle cx="27" cy="32" r="2" fill="#FF4D4D" />
  <circle cx="33" cy="32" r="2" fill="#FFD43B" />
  <circle cx="39" cy="32" r="2" fill="#7CFF6B" />
  <line x1="24" y1="38" x2="78" y2="38" stroke="#111111" stroke-width="1.5" />
  
  <!-- Code Prompt & Lines -->
  <polyline points="26,45 31,48 26,51" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="36" y1="48" x2="52" y2="48" stroke="#111111" stroke-width="2.5" stroke-linecap="round" />
  <line x1="26" y1="56" x2="68" y2="56" stroke="#111111" stroke-width="2" stroke-linecap="round" />
  <line x1="26" y1="61" x2="48" y2="61" stroke="#7CFF6B" stroke-width="2" stroke-linecap="round" />

  <!-- PC Tower -->
  <rect x="94" y="28" width="22" height="69" rx="3" fill="#FFFFFF" stroke="#111111" stroke-width="3.5" stroke-linejoin="round" />
  <!-- Power Button -->
  <circle cx="105" cy="38" r="3" fill="#7CFF6B" stroke="#111111" stroke-width="2" />
  <!-- USB / Optical Ports -->
  <rect x="100" y="47" width="10" height="2.5" rx="1" fill="#111111" />
  <rect x="100" y="53" width="10" height="2.5" rx="1" fill="#111111" />
  <!-- Cooling Vents -->
  <line x1="99" y1="72" x2="111" y2="72" stroke="#111111" stroke-width="2" stroke-linecap="round" />
  <line x1="99" y1="77" x2="111" y2="77" stroke="#111111" stroke-width="2" stroke-linecap="round" />
  <line x1="99" y1="82" x2="111" y2="82" stroke="#111111" stroke-width="2" stroke-linecap="round" />
  <line x1="99" y1="87" x2="111" y2="87" stroke="#111111" stroke-width="2" stroke-linecap="round" />
</svg>
