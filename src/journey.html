<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline Isometric Map</title>
  <link rel="stylesheet" href="map.css">
  <script src="libs/three.min.js" defer></script>
  <script src="map.js" defer></script>
</head>
<body>
  <div id="point-card" class="point-card" style="display: none;">
    <div class="card-header">
      <img id="card-icon" class="card-icon-img" src="assets/icons/hq.svg" alt="icon" />
      <div class="card-title-group">
        <h2 id="card-title">HQ Command</h2>
      </div>
      <button id="card-close" class="card-close-btn" type="button" aria-label="Close">×</button>
    </div>
    <div class="card-body">
      <p id="card-desc">Main strategic command center and operational base.</p>
      <div class="card-val-row">
        <span class="card-val-label">Station Value:</span>
        <span id="card-val-display" class="card-val-badge">0</span>
      </div>
    </div>
  </div>
  
  <div id="back">
    <button onclick="window.location.href = 'middle.html'">Back</button>
  </div>

  <div class="zoom-controls">
    <button id="zoom-in" title="Zoom In" aria-label="Zoom In">+</button>
    <button id="zoom-out" title="Zoom Out" aria-label="Zoom Out">-</button>
  </div>
</body>
</html>
