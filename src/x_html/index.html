<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adhicode - Choose Workspace</title>
    <link rel="stylesheet" href="../z_css/styles.css" />
    <script type="module" src="../y_js/main.js" defer></script>
  </head>

  <body>
    <div class="bg-glow"></div>
    <div class="bg-grid"></div>

    <main class="app-layout">
      <!-- Header Section -->
      <header class="brand-header">
        <div class="brand-badge">
          <img src="../assets/logo.svg" alt="Adhicode Logo" class="brand-logo" />
          <span class="brand-name">ADHICODE</span>
        </div>
        <h1 class="header-title">CHOOSE YOUR WORKSPACE</h1>
        <p class="header-subtitle">Select a workspace to continue your learning journey.</p>
      </header>

      <!-- Status Notification Message -->
      <div id="status-msg" class="status-toast" style="display: none;"></div>

      <!-- Profiles Grid Container -->
      <section id="profiles-section" class="profiles-container">
        <div id="profiles-grid" class="profiles-grid"></div>
      </section>
    </main>

    <!-- Create Workspace Modal -->
    <div id="add-modal" class="modal-backdrop" style="display: none;">
      <div class="modal-card">
        <div class="modal-header">
          <div class="modal-icon">+</div>
          <h2>Create New Workspace</h2>
        </div>
        <p class="modal-desc">Configure your personal workspace profile for Adhicode.</p>

        <form id="add-profile-form">
          <div class="form-group">
            <label for="new-profile-username">Username <span class="required">*</span></label>
            <input type="text" id="new-profile-username" placeholder="e.g. alex_dev" required autocomplete="off" />
          </div>

          <div class="form-group">
            <label for="new-profile-name">Display Name</label>
            <input type="text" id="new-profile-name" placeholder="e.g. Alex Rivera" autocomplete="off" />
          </div>

          <div class="form-group">
            <label for="new-profile-password">Password <span class="optional">(Optional protection)</span></label>
            <input type="password" id="new-profile-password" placeholder="Leave empty for unprotected profile" autocomplete="off" />
          </div>

          <div class="modal-actions">
            <button type="button" id="cancel-add-btn" class="btn-secondary">Cancel</button>
            <button type="submit" class="btn-primary">Create Workspace</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Password Verification Modal -->
    <div id="password-modal" class="modal-backdrop" style="display: none;">
      <div class="modal-card">
        <div class="modal-header">
          <div class="modal-icon">🔒</div>
          <h2 id="password-modal-title">Protected Workspace</h2>
        </div>
        <p class="modal-desc">Enter password to unlock this profile workspace.</p>

        <form id="password-form">
          <div class="form-group">
            <label for="profile-password-input">Password</label>
            <input type="password" id="profile-password-input" placeholder="Enter password..." required autocomplete="off" />
          </div>

          <div class="modal-actions">
            <button type="button" id="cancel-password-btn" class="btn-secondary">Cancel</button>
            <button type="submit" class="btn-primary">Unlock Workspace</button>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
