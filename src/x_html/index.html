<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="z_css/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adhicode</title>
    <script type="module" src="y_js/main.js" defer></script>
  </head>

  <body>
    <main class="container">
      <div class="title-container">
        <img src="assets/logo.svg" class="logo" />
        <hr class="strike" />
        <h1>Adhicode</h1>
      </div>

      <div id="status-msg" style="display: none;"></div>
      
      <section id="profiles-section">
        <h2>Choose A Profile</h2>
        <div id="profiles-grid"></div>
      </section>


      <div id="add-modal" style="display: none;">
        <h3>Create Profile</h3>
        <form id="add-profile-form">
          <label for="new-profile-username">Username</label>
          <input type="text" id="new-profile-username" required autocomplete="off" />

          <label for="new-profile-name">Display Name</label>
          <input type="text" id="new-profile-name" autocomplete="off" />

          <label for="new-profile-password">Password</label>
          <input type="password" id="new-profile-password" autocomplete="off" />

          <button type="button" id="cancel-add-btn">Cancel</button>
          <button type="submit">Confirm</button>
        </form>
      </div>

      <div id="password-modal" style="display: none;">
        <h3 id="password-modal-title">Password</h3>
        <form id="password-form">
          <input type="password" id="profile-password-input" required autocomplete="off" />
          <button type="button" id="cancel-password-btn">Cancel</button>
          <button type="submit">Confirm</button>
        </form>
      </div>
    </main>
    <button onClick="window.location.href = 'journey.html';">GTG</button>
  </body>
</html>
