<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learning Journey - Adhicode</title>
  <link rel="stylesheet" href="../z_css/map.css">
  <script src="../libs/three.min.js" defer></script>
  <script src="../y_js/map_utils.js" defer></script>
  <script src="../y_js/map.js" defer></script>
</head>
<body>
  <div id="point-card" class="point-card" style="display: none;">
    <div class="card-header">
      <span id="card-badge" class="card-badge">LESSON NODE</span>
      <button id="card-close" class="card-close-btn" type="button" aria-label="Close">×</button>
    </div>
    <div class="card-preview">
      <img id="card-icon" class="card-icon-img" src="../assets/icons/hq.svg" alt="Course Illustration" />
    </div>
    <div class="card-title-group">
      <h2 id="card-title">What is a PC</h2>
    </div>
    <div class="card-body">
      <p id="card-desc">Course Description</p>
    </div>
    <button id="visit-btn" class="visit-btn" type="button">START LESSON</button>
  </div>
  
  <div id="back">
    <button type="button" onclick="window.location.href = 'middle.html'">← BACK</button>
  </div>

  <div class="zoom-controls">
    <button id="zoom-in" title="Zoom In" aria-label="Zoom In">+</button>
    <button id="zoom-out" title="Zoom Out" aria-label="Zoom Out">-</button>
  </div>
</body>
</html>
