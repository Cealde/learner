<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline Isometric Map</title>
  <link rel="stylesheet" href="../z_css/map.css">
  <script src="../libs/three.min.js" defer></script>
  <script src="../y_js/map_utils.js" defer></script>
  <script src="../y_js/map.js" defer></script>
</head>
<body>
  <div id="point-card" class="point-card" style="display: none;">
    <div class="card-header">
      <img id="card-icon" class="card-icon-img" src="../assets/icons/hq.svg" alt="icon" />
      <div class="card-title-group">
        <h2 id="card-title">Curiculum Title</h2>
      </div>
      <button id="card-close" class="card-close-btn" type="button" aria-label="Close">×</button>
    </div>
    <div class="card-body">
      <p id="card-desc">Desc</p>
    </div>
    <button id="visit-btn">Visit Page</button>
  </div>
  
  <div id="back">
    <button onclick="window.location.href = 'middle.html'">Back</button>
  </div>

  <div class="zoom-controls">
    <button id="zoom-in" title="Zoom In" aria-label="Zoom In">+</button>
    <button id="zoom-out" title="Zoom Out" aria-label="Zoom Out">-</button>
  </div>
</body>
</html>
