<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lesson - Adhicode</title>
    <link rel="stylesheet" href="lesson.css" />
    <script type="module" src="loader.js" defer></script>
  </head>

  <body class="lesson-twin-page">
    <div class="bg-grid"></div>

    <!-- Header Navigation -->
    <header class="twin-header">
      <div class="twin-header-left">
        <button type="button" class="back-journey-btn" onclick="window.location.href = '../journey.html'">
          ← Learning Journey
        </button>
        <div class="header-divider"></div>
        <span class="twin-badge">Lesson</span>
        <div class="topic-pill">Topic: <strong id="topic-name">DIGITAL LOGIC</strong></div>
      </div>

      <div class="twin-header-right">
        <div class="twin-progress">
          <span id="header-progress-label" class="progress-label">Progress 20%</span>
          <div class="progress-bar-track">
            <div id="header-progress-bar" class="progress-bar-fill" style="width: 20%;"></div>
          </div>
        </div>
        <button type="button" class="exit-btn" onclick="window.location.href = '../journey.html'">Exit Lesson</button>
      </div>
    </header>

    <!-- Main 2-Column Grid Layout -->
    <main class="twin-main-grid">
      <!-- Left Sidebar: Constant Lesson Modules + Language Dropup -->
      <aside class="twin-sidebar">
        <div>
          <h3 class="sidebar-title">LESSON MODULES</h3>
          <nav class="module-nav" id="module-nav">
            <!-- Dynamic topics populated by loader.js -->
          </nav>
        </div>

        <!-- Language Dropup Menu Container (Replaced Pro Tip) -->
        <div id="sidebar-lang-container"></div>
      </aside>

      <!-- Center: Main Lesson Content -->
      <section class="twin-content-container">
        <div id="content" class="lesson-rich-body">
          <!-- Dynamic JSON Content Loaded by loader.js -->
        </div>
      </section>
    </main>

    <!-- Bottom Action Footer -->
    <footer class="twin-footer">
      <button type="button" class="nav-prev-btn">
        ← Learning Journey
      </button>
      <span id="footer-lesson-info" class="footer-lesson-info">Lesson 1.1</span>
      <button id="next-btn" class="nav-next-btn">Next Page →</button>
    </footer>
  </body>
</html>
