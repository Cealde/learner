<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lesson Twin: Practice Quiz - Adhicode</title>
    <link rel="stylesheet" href="lesson.css" />
    <script type="module" src="loader.js" defer></script>
  </head>

  <body class="lesson-twin-page">
    <div class="bg-grid"></div>

    <!-- Header Navigation -->
    <header class="twin-header">
      <div class="twin-header-left">
        <button type="button" class="back-journey-btn" onclick="window.location.href = '../journey.html'">
          ← Learning Journey
        </button>
        <div class="header-divider"></div>
        <span class="twin-badge">LESSON TWIN</span>
        <div class="topic-pill">Topic: <strong id="topic-name">PRACTICE & QUIZ</strong></div>
      </div>

      <div class="twin-header-right">
        <div class="twin-progress">
          <span id="header-progress-label" class="progress-label">Progress 100%</span>
          <div class="progress-bar-track">
            <div id="header-progress-bar" class="progress-bar-fill" style="width: 100%;"></div>
          </div>
        </div>
        <button type="button" class="exit-btn" onclick="window.location.href = '../journey.html'">Exit Lesson</button>
      </div>
    </header>

    <!-- Main 2-Column Grid Layout -->
    <main class="twin-main-grid">
      <!-- Left Sidebar: Constant Lesson Modules + Language Dropup -->
      <aside class="twin-sidebar">
        <div>
          <h3 class="sidebar-title">LESSON MODULES</h3>
          <nav class="module-nav" id="module-nav">
            <!-- Dynamic topics populated by loader.js -->
          </nav>
        </div>

        <!-- Language Dropup Menu Container (Replaced Pro Tip) -->
        <div id="sidebar-lang-container"></div>
      </aside>

      <!-- Center: Interactive MCQ Quiz (Hydrated from JSON) -->
      <section class="twin-content-container">
        <div class="mcq-container">
          <div class="mcq-card">
            <!-- Header: Badge & Question Indicator Dots -->
            <div class="mcq-quiz-header">
              <div id="mcq-badge" class="mcq-badge">MODULE QUIZ • QUESTION 1 OF 1</div>
              <div id="question-dots" class="mcq-question-dots"></div>
            </div>

            <h2 class="mcq-question">Loading Question...</h2>

            <div class="mcq-code-box">
              <pre><code></code></pre>
            </div>

            <!-- Option Buttons Grid -->
            <div class="mcq-options-grid" id="options-group">
              <!-- Dynamically populated from JSON -->
            </div>

            <!-- Feedback Box -->
            <div id="quiz-feedback" class="mcq-feedback-box"></div>

            <!-- Action Bar: Previous & Next Question Buttons -->
            <div class="mcq-action-bar">
              <button id="prev-question-btn" type="button" class="mcq-prev-q-btn" style="display: none;">
                ← Previous Question
              </button>
              <button id="next-question-btn" type="button" class="mcq-next-q-btn" style="display: none;">
                Next Question ->
              </button>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- Bottom Action Footer -->
    <footer class="twin-footer">
      <button type="button" class="nav-prev-btn">
        ← Previous Page
      </button>
      <span id="footer-lesson-info" class="footer-lesson-info">Lesson 1.4: Practice Quiz</span>
      <button id="next-btn" class="nav-next-btn">Next Page →</button>
    </footer>
  </body>
</html>
